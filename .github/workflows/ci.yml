name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  server:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
        node-version: [22.x]
    services:
      mariadb:
        image: mariadb:10.5
        ports:
          - 3306:3306
        env:
          MARIADB_USER: cabbagemeet
          MARIADB_PASSWORD: cabbagemeet
          MARIADB_DATABASE: cabbagemeet
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "true"
        # Adapted from https://stackoverflow.com/a/54854239
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:13.11
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: cabbagemeet
          POSTGRES_PASSWORD: cabbagemeet
        # Copied from https://docs.github.com/en/actions/using-containerized-services/creating-postgresql-service-containers
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: ${{ matrix.node-version }}
          cache: true
      - run: vp install
      - run: vp run cabbagemeet-server#build
        env:
          SQLITE_PATH: ":memory:"
      - name: E2E tests (SQLite)
        run: vp run cabbagemeet-server#test:e2e
      - name: E2E tests (MariaDB)
        run: vp run cabbagemeet-server#test:e2e:mariadb
      - name: E2E tests (Postgres)
        run: vp run cabbagemeet-server#test:e2e:postgres

  client:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "22"
          cache: true
      - run: vp install
      - run: vp check
      - run: vp run cabbagemeet-client#build
      - run: vp run cabbagemeet-server#build
        env:
          SQLITE_PATH: ":memory:"
      - name: Get installed Playwright version
        run: |
          echo PLAYWRIGHT_VERSION=$(node -e "console.log(require('./client/node_modules/@playwright/test/package.json').version)") >> $GITHUB_ENV
      - name: Cache playwright binaries
        uses: actions/cache@v4
        with:
          path: "~/.cache/ms-playwright"
          key: linux-playwright-${{ env.PLAYWRIGHT_VERSION }}
      - run: vp exec playwright install --with-deps
        working-directory: client
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - name: Set timezone
        run: sudo ln -sf /usr/share/zoneinfo/America/New_York /etc/localtime
      - name: Run Playwright E2E tests
        run: vp run cabbagemeet-client#test:e2e
        env:
          DATABASE_TYPE: sqlite
          SQLITE_PATH: ":memory:"
          HOST: localhost
          PORT: "3001"
          PUBLIC_URL: "http://localhost:3001"
          VERIFY_SIGNUP_EMAIL_ADDRESS: "false"
          HOURLY_MEETING_CREATION_LIMIT_PER_IP: "0"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: client/test-results/
          retention-days: 3
