packages:
  - client
  - server
allowBuilds:
  '@nestjs/core': false
  '@parcel/watcher': false
  bcrypt: false
  better-sqlite3: false
  esbuild: false
  msw: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  vite-plus: latest
overrides:
  vite: 'catalog:'
  vitest: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
